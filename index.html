/* ================= Remove a mark (press and hold a done task) =================
   For a mistaken tap. If removing it takes the day below a Good Day, the Good Day cache goes with it;
   a perk cache tied to that tap (Daemon, Hull Plating) goes too. Logging it again later rolls a fresh cache. */
const holdAttrs = e => e && e.id ? ' data-hold="1" data-eid="' + esc(e.id) + '" data-action="hold-hint" title="Press and hold to remove the mark"' : '';
function unmarkPlan(eid){
  const map = allEntries(), e = map.get(eid);
  if (!e) return null;
  const temp = new Map(map); temp.delete(eid);
  const D0 = derive(map), D1 = derive(temp), d = e.day;
  const a = d && D0.verdict[d] ? D0.verdict[d].state : null, b = d && D1.verdict[d] ? D1.verdict[d].state : null;
  const lostGood = a === 'good' && b !== 'good';
  const dels = [eid];
  if (map.has('cache-pc-' + eid)) dels.push('cache-pc-' + eid);
  if (lostGood && map.has('cache-day-' + d)) dels.push('cache-day-' + d);
  return {e, d, a, b, lostGood, dels, v1: d ? D1.verdict[d] : null};
}
function openUnmark(eid){
  const P = unmarkPlan(eid); if (!P) return;
  const e = P.e, c = classify(e), t = c ? task(c.cat, c.ref) : null;
  const name = t ? t.name : String(e.ref || 'This task');
  const when = c && c.cat === 'weekly' ? 'the week of ' + fmtDay(c.key) : c && c.cat === 'monthly' ? monthName(c.key) : fmtDay(e.day);
  let warn = '';
  if (P.lostGood) warn = 'This takes ' + fmtDay(P.d) + ' back to ' + P.v1.n + ' of ' + P.v1.need + ', so the Good Day comes off' + (P.dels.indexOf('cache-day-' + P.d) >= 0 ? ', and its cache with it' : '') + '.';
  else if (P.a === 'floor' && P.b === 'blank') warn = 'That was the only mark on ' + fmtDay(P.d) + ', so the day goes back to blank.';
  sfx('soft');
  openModal('<section class="frame"><div class="frame-head"><span>Remove mark</span><span class="tag">EDIT</span></div>' +
    '<h2 class="ptitle">' + esc(name) + '</h2>' +
    '<p class="instr">Logged for ' + esc(when) + (e.at ? ' at ' + hhmm(new Date(e.at)) : '') + '. Remove it if the tap was a mistake.</p>' +
    (warn ? '<p class="unmark-warn">' + esc(warn) + '</p>' : '') +
    '<div class="actions"><button class="btn primary" type="button" data-action="unmark-yes" data-eid="' + esc(eid) + '">Remove mark</button>' +
    '<button class="btn" type="button" data-action="close-modal">Keep it</button></div></section>');
}
async function unmark(eid){
  if (!ready() || busy) return;
  const P = unmarkPlan(eid);
  closeModal();
  if (!P) return;
  try { for (const id of P.dels) await Store.del(id); }
  catch(err){ failToast(err); render(); return; }
  sfx('undo');
  toast('Mark removed' + (P.lostGood ? ' · Good Day undone' : ''));
  render();
}
/* The hold itself: 550 ms on a done task opens the dialog. Moving the finger cancels it. */
let holdT = null, holdEl = null, holdXY = null, holdAt = 0, holdMute = 0; // holdMute: ignore the click that comes from lifting the finger after a hold
function holdCancel(){
  if (holdT){ clearTimeout(holdT); holdT = null; }
  if (holdEl){ holdEl.classList.remove('holding'); holdEl = null; }
}
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-hold]');
  if (!el || !ready() || (e.button != null && e.button > 0)) return;
  holdCancel();
  holdEl = el; holdXY = [e.clientX, e.clientY]; el.classList.add('holding');
  holdT = setTimeout(() => {
    holdT = null; const id = el.dataset.eid; holdCancel(); holdAt = Date.now(); holdMute = holdAt + 10000;
    try { if (navigator.vibrate) navigator.vibrate(12); } catch(_){}
    openUnmark(id);
  }, 550);
}, {passive:true});
document.addEventListener('pointermove', e => { if (holdT && holdXY && Math.hypot(e.clientX - holdXY[0], e.clientY - holdXY[1]) > 10) holdCancel(); }, {passive:true});
const holdEnd = () => { holdCancel(); if (holdMute > Date.now() + 400) holdMute = Date.now() + 400; };
document.addEventListener('pointerup', holdEnd, {passive:true});
document.addEventListener('pointercancel', holdEnd, {passive:true});
document.addEventListener('contextmenu', e => {
  const el = e.target.closest('[data-hold]'); if (!el) return;

    S.nodeDraft = e.target.value.slice(0, 140);
  }
  if (e.target && e.target.id === 'linkurl'){
    S.linkDraft = e.target.value.slice(0, 400);
  }
});
document.addEventListener('submit', e => {
  if (e.target && e.target.id === 'addnode-form'){ e.preventDefault(); addNode(); }
  if (e.target && e.target.id === 'link-form'){ e.preventDefault(); linkShip(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

/* Keep the iPad screen awake while the Deck is visible (best effort). */
let wake = null;
async function keepAwake(){
  try {
    if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible'){
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release', () => { wake = null; });
    }
  } catch(e){}
}
document.addEventListener('pointerdown', () => { S.lastTouch = Date.now(); keepAwake(); }, {passive:true});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ keepAwake(); render(); syncNow(); } });
window.addEventListener('online', () => syncNow());
/* Pull changes from other devices (and patches from the Operator) every minute while open. */
setInterval(() => { if (Remote.url && document.visibilityState === 'visible') syncNow(); }, 60000);

/* Clock: refresh every 20 s; drift back to Now after 3 idle minutes. */
setInterval(() => {
  const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (S.tab !== 'now' && !typing && $('#modal').hidden && Date.now() - S.lastTouch > 180000){ S.tab = 'now'; S.confirmBuy = null; S.wkOff = 0; }
  if (typing){ const c = $('#clock'); if (c) c.textContent = hhmm(new Date()); }
  else render();
}, 20000);

/* ================= Boot ================= */
async function init(){
  loadPending();
  if (Remote.load()){
    S.mode = 'remote';
    try { const c = JSON.parse(ls.get('cache') || 'null'); if (c) applyState(c); } catch(e){}
    render(); S.booted = true;
    syncNow();
  } else {
    S.mode = 'unlinked';
    render(); S.booted = true;
  }
}
init();
})();
</script>
</body>
